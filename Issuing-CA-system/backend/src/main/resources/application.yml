server:
  port: ${CA_SERVER_PORT:8081}
  shutdown: graceful
  ssl:
    enabled: ${CA_TLS_ENABLED:false}
    key-store: ${CA_TLS_KEYSTORE:}
    key-store-password: ${CA_TLS_KEYSTORE_PASSWORD:}
    key-store-type: PKCS12
    trust-store: ${CA_TLS_TRUSTSTORE:}
    trust-store-password: ${CA_TLS_TRUSTSTORE_PASSWORD:}
    trust-store-type: PKCS12
    client-auth: need
    enabled-protocols: TLSv1.3
spring:
  application:
    name: issuing-ca-backend
  datasource:
    url: ${CA_DB_URL:jdbc:mariadb://localhost:3307/ca_system}
    username: ${CA_DB_USERNAME:ca_system}
    password: ${CA_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${CA_DB_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
management:
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health.probes.enabled: true
app:
  security:
    mtls-required: ${CA_MTLS_REQUIRED:true}
    allowed-client-subjects: ${CA_ALLOWED_CLIENT_SUBJECTS:}
  hsm:
    pkcs11-config: ${HSM_PKCS11_CONFIG:}
    key-alias: ${HSM_CA_KEY_ALIAS:}
    pin: ${HSM_PIN:}
  ca:
    signature-hash: ${CA_SIGNATURE_HASH:SHA256}
    crl-validity-hours: ${CRL_VALIDITY_HOURS:24}
    certificate-validity-days: ${DEFAULT_CERTIFICATE_VALIDITY_DAYS:365}
