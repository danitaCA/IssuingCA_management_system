server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
spring:
  application:
    name: issuing-ca-backend
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/ra_system}
    username: ${DB_USERNAME:ra_system}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
app:
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:15}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  bootstrap:
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  ca:
    base-url: ${CA_BASE_URL:http://localhost:8090/api/v1}
    connect-timeout-seconds: 3
    read-timeout-seconds: 20
    client-keystore: ${CA_CLIENT_KEYSTORE:}
    client-keystore-password: ${CA_CLIENT_KEYSTORE_PASSWORD:}
    truststore: ${CA_TRUSTSTORE:}
    truststore-password: ${CA_TRUSTSTORE_PASSWORD:}
  renewal:
    notification-days: ${RENEWAL_NOTIFICATION_DAYS:30}
logging:
  structured:
    format:
      console: logstash
